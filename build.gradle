plugins {
  id 'base'
  id 'org.springframework.boot' version '4.0.9' apply false
}

ext.springCloudVersion = '2025.1.4'

subprojects {
  group = 'com.example'
  version = '0.0.1-SNAPSHOT'

  pluginManager.withPlugin('java') {
    java {
      toolchain {
        languageVersion = JavaLanguageVersion.of(21)
      }
    }

    tasks.withType(JavaCompile).configureEach {
      options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
      useJUnitPlatform()
    }
  }

  if (name in ['group-purchase-service', 'api-gateway']) {
    pluginManager.withPlugin('org.springframework.boot') {
      // Opt-in local verification artifact; product bootJar and Docker need no probe sources.
      def probe = sourceSets.create('runtimeProbe')
      probe.java.srcDir rootProject.file('scripts/runtime-probe')
      probe.compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
      probe.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
      def bootJarType = plugins.getPlugin('org.springframework.boot').class.classLoader
          .loadClass('org.springframework.boot.gradle.tasks.bundling.BootJar')
      tasks.register('runtimeProbeJar', bootJarType) {
        dependsOn tasks.named('runtimeProbeClasses'), tasks.named('classes')
        archiveClassifier = 'runtime-probe'
        mainClass = 'com.example.runtimeprobe.RuntimeProbe'
        targetJavaVersion = JavaVersion.VERSION_21
        classpath = probe.runtimeClasspath
      }
    }
  }
}
