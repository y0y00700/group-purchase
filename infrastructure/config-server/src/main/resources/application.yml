spring:
  main:
    banner-mode: off
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        accept-empty: false
        native:
          search-locations: "${CONFIG_REPO_LOCATION:file:./config-repo/}"
          add-label-locations: false
        health:
          repositories:
            group-purchase-local:
              name: group-purchase
              profiles: local
            group-purchase-docker:
              name: group-purchase
              profiles: docker
            eureka-server-local:
              name: eureka-server
              profiles: local
            eureka-server-docker:
              name: eureka-server
              profiles: docker

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,configurationRepository

  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:local}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${APP_ENVIRONMENT:local}
