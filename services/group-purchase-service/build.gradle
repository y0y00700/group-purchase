plugins {
  id 'java'
  id 'org.springframework.boot'
}

description = 'Goal-based group purchase'

sourceSets {
  inboxProbe {
    compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
  }
  outboxProbe {
    compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
  }
  kafkaProbe {
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
  }
}
configurations {
  kafkaProbeImplementation.extendsFrom implementation
  kafkaProbeRuntimeOnly.extendsFrom runtimeOnly
  testImplementation.extendsFrom kafkaProbeImplementation
}
sourceSets.test.compileClasspath += sourceSets.kafkaProbe.output
sourceSets.test.compileClasspath += sourceSets.inboxProbe.output

dependencies {
  implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
  implementation platform("org.springframework.cloud:spring-cloud-dependencies:${rootProject.springCloudVersion}")
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.flywaydb:flyway-database-postgresql'
  runtimeOnly 'org.postgresql:postgresql'
  implementation 'org.springframework.cloud:spring-cloud-starter-config'
  implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testImplementation 'org.testcontainers:testcontainers-kafka'
  implementation 'org.apache.kafka:kafka-clients'
  testImplementation project(':config-server')
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  dependsOn tasks.named('inboxProbeJar')
  systemProperty 'test.inbox-jar', layout.buildDirectory.file('libs/group-purchase-service-0.0.1-SNAPSHOT-inbox-probe.jar').get().asFile.absolutePath
  dependsOn tasks.named('outboxProbeJar')
  systemProperty 'test.outbox-jar', layout.buildDirectory.file('libs/group-purchase-service-0.0.1-SNAPSHOT-outbox-probe.jar').get().asFile.absolutePath
  dependsOn tasks.named('kafkaProbeClasses')
  classpath += sourceSets.kafkaProbe.output
  classpath += sourceSets.inboxProbe.output
  dependsOn ':eureka-server:bootJar'
  systemProperty 'test.postgres-init', rootProject.file('infrastructure/postgres/init/010-service-databases.sh').absolutePath
  systemProperty 'test.config-repo', rootProject.file('config-repo').absolutePath
  systemProperty 'test.eureka-jar', project(':eureka-server').layout.buildDirectory
      .file('libs/eureka-server-0.0.1-SNAPSHOT.jar').get().asFile.absolutePath
}

tasks.register('outboxProbeJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
  dependsOn tasks.named('outboxProbeClasses')
  archiveClassifier = 'outbox-probe'
  mainClass = 'com.example.grouppurchase.outboxprobe.OutboxProbe'
  targetJavaVersion = JavaVersion.VERSION_21
  classpath = sourceSets.outboxProbe.runtimeClasspath
}

tasks.register('kafkaProbeJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
  dependsOn tasks.named('kafkaProbeClasses')
  archiveClassifier = 'kafka-probe'
  mainClass = 'com.example.grouppurchase.kafkaprobe.KafkaProbe'
  targetJavaVersion = JavaVersion.VERSION_21
  classpath = sourceSets.kafkaProbe.runtimeClasspath
}

tasks.register('verifyKafkaIsolation') {
  dependsOn tasks.named('bootJar'), tasks.named('kafkaProbeJar'), tasks.named('inboxProbeJar')
  doLast {
    def product = zipTree(tasks.named('bootJar').get().archiveFile.get().asFile)
    assert product.matching { include '**/kafkaprobe/**', '**/outboxprobe/**', '**/inboxprobe/**', '**/runtimeprobe/**', 'BOOT-INF/lib/junit-*', 'BOOT-INF/lib/testcontainers-*' }.isEmpty():
        'Product JAR must not contain probes or test libraries'
    assert !product.matching { include 'BOOT-INF/lib/kafka-clients-*' }.isEmpty()
    assert !product.matching { include '**/KafkaOutboxTransport.class' }.isEmpty()
    assert !product.matching { include '**/InboxConsumerLoop.class' }.isEmpty()
    assert !product.matching { include '**/KafkaDltTransport.class' }.isEmpty()
    def inboxProbe = zipTree(tasks.named('inboxProbeJar').get().archiveFile.get().asFile)
    assert !inboxProbe.matching { include '**/inboxprobe/InboxProbe.class' }.isEmpty()
    assert inboxProbe.matching { include 'BOOT-INF/lib/junit-*', 'BOOT-INF/lib/testcontainers-*' }.isEmpty()
    def probe = zipTree(tasks.named('kafkaProbeJar').get().archiveFile.get().asFile)
    assert !probe.matching { include 'BOOT-INF/lib/kafka-clients-*' }.isEmpty()
    assert !probe.matching { include '**/kafkaprobe/KafkaProbe.class' }.isEmpty()
  }
}

tasks.register('inboxProbeJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
  dependsOn tasks.named('inboxProbeClasses')
  archiveClassifier = 'inbox-probe'
  mainClass = 'com.example.grouppurchase.inboxprobe.InboxProbe'
  targetJavaVersion = JavaVersion.VERSION_21
  classpath = sourceSets.inboxProbe.runtimeClasspath
}
tasks.named('check') { dependsOn tasks.named('verifyKafkaIsolation') }
