name: group-purchase

services:
  pg-mock-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_mock_postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets:
      - pg_mock_postgres_password
      - pg_mock_password
    volumes:
      - pg-mock-postgres-data:/var/lib/postgresql
      - ./infrastructure/pg-mock-postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_MOCK_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  pg-mock:
    build:
      context: .
      dockerfile: infrastructure/pg-mock/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    secrets:
      - source: pg_mock_password
        target: spring.datasource.password
      - source: pg_mock_api_credential
        target: app.auth.api-credential
    depends_on:
      pg-mock-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PG_MOCK_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8082/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    stop_grace_period: 30s

  kafka-init:
    image: apache/kafka:4.1.2
    entrypoint: ["/bin/bash", "/contract/init-topics.sh"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka:/contract:ro

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets:
      - postgres_password
      - member_password
      - group_purchase_password
      - payment_password
      - notification_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  config-server:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: infrastructure/config-server/Dockerfile
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo/
      APP_ENVIRONMENT: docker
    volumes:
      - type: bind
        source: ./config-repo
        target: /config-repo
        read_only: true
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  eureka-server:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: infrastructure/eureka-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  group-purchase-service:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: services/group-purchase-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    secrets:
      - source: group_purchase_password
        target: spring.datasource.password
      - source: group_purchase_internal_credential
        target: app.auth.internal-credential
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 70s

  member-service:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: services/member-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    secrets:
      - source: member_password
        target: spring.datasource.password
      - source: member_internal_credential
        target: app.auth.internal-credential
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  api-gateway:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    secrets:
      - source: member_internal_credential
        target: app.auth.member-internal-credential
      - source: group_purchase_internal_credential
        target: app.auth.group-purchase-internal-credential
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:9000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

# PostgreSQL receives bootstrap credentials; each app receives only its own secret.
secrets:
  pg_mock_postgres_password:
    file: ./secrets/pg_mock_postgres_password
  pg_mock_password:
    file: ./secrets/pg_mock_password
  pg_mock_api_credential:
    file: ./secrets/pg_mock_api_credential
  postgres_password:
    file: ./secrets/postgres_password
  member_password:
    file: ./secrets/member_password
  group_purchase_password:
    file: ./secrets/group_purchase_password
  payment_password:
    file: ./secrets/payment_password
  member_internal_credential:
    file: ./secrets/member_internal_credential
  group_purchase_internal_credential:
    file: ./secrets/group_purchase_internal_credential
  notification_password:
    file: ./secrets/notification_password

volumes:
  pg-mock-postgres-data:
  kafka-data:
  postgres-data:
