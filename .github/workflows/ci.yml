name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: bash ./gradlew build --no-daemon

  compose-smoke:
    name: Images and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: group-purchase-012

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 for product JAR checks
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build member product JAR and Kafka verification JAR
        run: bash ./gradlew :member-service:bootJar :group-purchase-service:bootJar :group-purchase-service:kafkaProbeJar :group-purchase-service:outboxProbeJar --no-daemon

      - name: Prepare job-local secrets
        run: python3 scripts/prepare-ci-secrets.py

      - name: Validate Compose definition
        run: docker compose config --quiet

      - name: Build and start seven services and topic initialization
        run: docker compose up --build --wait --wait-timeout 240

      - name: Check Kafka contracts and both listeners
        run: python3 scripts/check-kafka.py --project group-purchase-012

      - name: Check product Outbox scheduler and original Kafka bytes
        run: python3 scripts/check-outbox.py --project group-purchase-012

      - name: Check database boundaries and persistence
        run: python3 scripts/check-postgres.py --stage application --persistence

      - name: Check applied configuration
        run: |
          curl --fail --silent http://localhost:8080/actuator/info | python3 -c 'import json, sys; config = json.load(sys.stdin)["configuration"]; assert config == {"service": "group-purchase", "environment": "docker", "revision": "002-v1"}, config'
          curl --fail --silent http://localhost:8761/actuator/info | python3 -c 'import json, sys; config = json.load(sys.stdin)["configuration"]; assert config == {"service": "eureka-server", "environment": "docker", "revision": "003-v1"}, config'
          docker compose exec -T api-gateway curl --fail --silent http://localhost:9000/actuator/info | python3 -c 'import json, sys; config = json.load(sys.stdin)["configuration"]; assert config == {"service": "api-gateway", "environment": "docker", "revision": "004-v1"}, config'

      - name: Check registration and reachability of the registered address
        run: python3 scripts/check-discovery.py

      - name: Check Gateway routing and private paths
        run: python3 scripts/check-gateway.py

      - name: Check member authentication on Compose and two product JARs
        run: python3 scripts/check-member-auth.py

      - name: Check purchase workflow and Gateway caller trust on Compose
        run: python3 scripts/check-gateway-auth.py

      - name: Check API observability and probe recovery
        run: python3 scripts/check-api-observability.py --db-recovery

      - name: Collect service diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
          curl --silent --max-time 5 -H 'Accept: application/json' http://localhost:8761/eureka/apps || true

      - name: Stop services
        if: always()
        run: |
          docker compose down -v
          python3 -c 'import shutil; shutil.rmtree("secrets", ignore_errors=True)'
