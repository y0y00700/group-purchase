name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: bash ./gradlew build --no-daemon

  compose-smoke:
    name: Images and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose definition
        run: docker compose config --quiet

      - name: Build and start both services
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check applied configuration
        run: |
          curl --fail --silent http://localhost:8080/actuator/info | python3 -c 'import json, sys; config = json.load(sys.stdin)["configuration"]; assert config == {"service": "group-purchase", "environment": "docker", "revision": "002-v1"}, config'

      - name: Collect service diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150

      - name: Stop services
        if: always()
        run: docker compose down
