pluginManagement {
  repositories {
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    mavenCentral()
  }
}

rootProject.name = 'group-purchase'

include 'group-purchase-service'
project(':group-purchase-service').projectDir = file('services/group-purchase-service')

include 'config-server'
project(':config-server').projectDir = file('infrastructure/config-server')

include 'eureka-server'
project(':eureka-server').projectDir = file('infrastructure/eureka-server')

include 'api-gateway'
project(':api-gateway').projectDir = file('infrastructure/api-gateway')

include 'member-service'
project(':member-service').projectDir = file('services/member-service')
