server:
  port: 8080

app:
  outbox:
    enabled: true
    poll-ms: 10000
    maximum: 50
    budget-ms: 10000
    lease-ms: 60000
  messaging:
    kafka:
      max-block-ms: 10000
      request-timeout-ms: 10000
      delivery-timeout-ms: 30000
      future-wait-ms: 35000
  configuration:
    service: group-purchase
    revision: "002-v1"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    should-enforce-registration-at-init: false
    healthcheck:
      enabled: true
    timeout:
      connect-timeout: 1000
      connect-request-timeout: 1000
      socket-timeout: 5000
  instance:
    instance-id: "${spring.application.name}:${app.configuration.environment}:${spring.cloud.client.hostname}:${server.port}"
    prefer-ip-address: false
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info

spring:
  datasource:
    username: group_purchase_app
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
  flyway:
    schemas: app
    default-schema: app
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    connect-retries: 0
  sql:
    init:
      mode: never
  cloud:
    discovery:
      client:
        health-indicator:
          enabled: false
        composite-indicator:
          enabled: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
