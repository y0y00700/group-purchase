server:
  port: 8000

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  health:
    config:
      enabled: false

app:
  auth:
    connect-timeout: 1s
    check-timeout: 2s
  configuration:
    service: api-gateway
    revision: "004-v1"

spring:
  cloud:
    loadbalancer:
      retry:
        enabled: false
    discovery:
      client:
        health-indicator:
          enabled: false
        composite-indicator:
          enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: group-purchase-ping
              uri: lb://group-purchase
              predicates:
                - ExactPath=/api/group-purchases/ping
                - Method=GET
            - id: member-csrf
              uri: lb://member
              metadata:
                auth-policy: member
              predicates:
                - ExactPath=/api/auth/csrf
                - Method=GET,HEAD
            - id: member-login
              uri: lb://member
              metadata:
                auth-policy: member
              predicates:
                - ExactPath=/api/auth/login
                - Method=POST
            - id: member-logout
              uri: lb://member
              metadata:
                auth-policy: member
              predicates:
                - ExactPath=/api/auth/logout
                - Method=POST
            - id: member-me
              uri: lb://member
              metadata:
                auth-policy: member
              predicates:
                - ExactPath=/api/members/me
                - Method=GET,HEAD
            - id: group-purchase-public-list
              uri: lb://group-purchase
              metadata:
                auth-policy: public-purchase
              predicates:
                - ExactPath=/api/group-purchases
                - Method=GET,HEAD
            - id: group-purchase-public-detail
              uri: lb://group-purchase
              metadata:
                auth-policy: public-purchase
              predicates:
                - UuidPath=/api/group-purchases/{id}
                - Method=GET,HEAD
            - id: group-purchase-seller-list
              uri: lb://group-purchase
              metadata:
                auth-policy: protected
              predicates:
                - ExactPath=/api/group-purchases/mine
                - Method=GET,HEAD
            - id: group-purchase-seller-detail
              uri: lb://group-purchase
              metadata:
                auth-policy: protected
              predicates:
                - UuidPath=/api/group-purchases/mine/{id}
                - Method=GET,HEAD
            - id: group-purchase-register
              uri: lb://group-purchase
              metadata:
                auth-policy: protected
              predicates:
                - ExactPath=/api/group-purchases
                - Method=POST
            - id: group-purchase-revise
              uri: lb://group-purchase
              metadata:
                auth-policy: protected
              predicates:
                - UuidPath=/api/group-purchases/{id}
                - Method=PUT
            - id: group-purchase-publish
              uri: lb://group-purchase
              metadata:
                auth-policy: protected
              predicates:
                - UuidPath=/api/group-purchases/{id}/publish
                - Method=POST
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    timeout:
      connect-timeout: 1000
      connect-request-timeout: 1000
      socket-timeout: 5000
